# ==============================================================================
# heuristics.yaml — the unwritten rules, written down.
#
# These encode tribal knowledge that legitimately overrides the documented
# policy. They live here rather than inside an agent prompt for three reasons:
# they are auditable, they are testable, and they can be shown to a domain
# expert for sign-off without reading any code.
#
# heuristic_override_agent runs LAST and its verdict supersedes domain agents.
# Every fire writes rule_id + before/after to ops.audit_log.
#
# The rules below are ILLUSTRATIVE (matching the user's stated example).
# On sprint day these come from the interviewer's domain brief.
# ==============================================================================
version: 1

rules:
  - id: HEU-001
    name: orion_close_is_authoritative_for_a_held_position
    supersedes: quote_snapshot_agent
    when:
      all:
        - "decision.field == 'prev_close'"
        - "context.intent == 'prior_close'"
        - "context.position.orion_account_id != null"
        - "context.position.as_of_date == context.request.prior_session_date"
    then:
      source: "orion"
      value_from: "pos.position_snapshot.close_price"
    rationale: >
      The desk reconciles to Orion, and the number an advisor reads back to a
      client has to match the client's statement. When the two disagree on what
      a held position closed at, the free-tier vendor is the one that is wrong
      for this purpose. Elicited directly from the sponsor rather than inferred.
    owner: "Andrew Nelson (sponsor), 2026-09-08"
    confidence: high
    audit: required

  - id: HEU-003
    name: never_override_a_block
    supersedes: "*"
    when:
      all: ["gate.decision == 'BLOCK'"]
    then:
      halt: true
    rationale: >
      Ceiling rule. Heuristics may loosen business policy; they may never loosen
      a safety gate. Without this, tribal knowledge becomes a jailbreak.
    owner: system
    confidence: absolute
    audit: required

conflict_policy:
  on_multiple_matches_same_outcome: "apply highest-confidence rule, log all matched ids"
  on_multiple_matches_opposite_outcome: "INDETERMINATE -> ops.hitl_queue, apply nothing"
  on_precondition_null: "INDETERMINATE -> ops.hitl_queue, apply nothing"

authoring_rules:
  - "A rule with no named owner is not a rule. It is a guess. Delete it."
  - "Every rule needs a golden-set case proving it fires and one proving it does not."
  - "Rules narrow to a condition set. 'Use judgment' is not a condition."
